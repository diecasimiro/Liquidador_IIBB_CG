[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iibb"
version = "0.1.0"
description = "Liquidación IIBB Convenio Multilateral - Estudio CG"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "xlrd==1.2.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "loguru>=0.7",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
iibb-seed = "iibb.seed:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iibb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
